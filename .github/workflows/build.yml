name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and launchd examples
        run: |
          bash -n build.sh install.sh tailscaled-wrapper.sh tailscale-watchdog.sh diagnose-network.sh
          plutil -lint Resources/Info.plist launchd/*.plist
      - name: Build and verify app
        run: |
          ./build.sh
          codesign --verify --deep --strict TailscaleMenuBar.app
      - name: Run AppKit self-tests on Apple Silicon runners
        if: runner.arch == 'ARM64'
        run: ./TailscaleMenuBar.app/Contents/MacOS/TailscaleMenuBar --self-test
